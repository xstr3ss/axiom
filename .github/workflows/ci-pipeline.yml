name: CI/CD Test Pipeline

on: [push]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pytest
        run: pip install pytest

      - name: Run Pytest Suite
        id: test_suite
        run: |
          echo "Starting Pytest suite..."
          # Run pytest. If it fails, we pipe the output to error.log and force the step to fail so the webhook triggers.
          pytest test_auth.py > error.log 2>&1 || (cat error.log && exit 1)

      - name: Alert Autonomous Engine via Ngrok
        if: failure()
        run: |
          # Capture the end of the pytest failure log
          ERROR_LOG=$(tail -n 30 error.log)
          
          # Use jq to safely escape the log string into valid JSON
          JSON_PAYLOAD=$(jq -n \
            --arg repo "${{ github.repository }}" \
            --arg log "$ERROR_LOG" \
            '{"repository": $repo, "error_log": $log, "pr_number": 99}')
            
          curl -X POST "https://delicious-tint-karma.ngrok-free.dev/webhook" \
          -H "Content-Type: application/json" \
          -d "$JSON_PAYLOAD"
