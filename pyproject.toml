[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-engine"
version = "0.1.0"
description = "Autonomous Self-Healing & Z3 Formally Verified Coding Agent"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Shyam Shukla"}
]
dependencies = [
    "qdrant-client>=1.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "groq>=0.9.0",
    "z3-solver>=4.12.0",
    "pytest>=8.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0"
]

[project.scripts]
axiom = "axiom_cli:main"

[tool.setuptools]
py-modules = [
    "ast_pruner",
    "auto_harvester",
    "auto_watcher",
    "axiom_cli",
    "backend_main",
    "bug_resolution_store",
